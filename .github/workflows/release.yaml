name: 发布 Windows 安装包

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在且与 version 文件一致的标签，例如 v3.5.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
      release_tag: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      BUILD_VERSION: ${{ needs.build.outputs.version }}
      BUILD_COMMIT: ${{ needs.build.outputs.commit_sha }}

    steps:
      - name: 获取已通过构建的同一提交
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 下载本次构建的不可变产物
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-artifacts
          digest-mismatch: error

      - name: 再次核对标签、提交与安装包校验值
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -cne "v$($env:BUILD_VERSION)") { throw '发布版本不一致。' }
          $tagCommit = (git rev-parse "refs/tags/$($env:RELEASE_TAG)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:BUILD_COMMIT) {
            throw '发布标签已变化，必须重新测试和构建该提交。'
          }
          $installerName = "MorseWriter-Setup-v$($env:BUILD_VERSION)-x64.exe"
          $installer = Join-Path 'release-artifacts' $installerName
          $checksum = (Get-Content -LiteralPath 'release-artifacts/SHA256SUMS' -Raw).Trim()
          if ($checksum -notmatch '^([0-9a-fA-F]{64}) [ *](.+)$' -or $Matches[2] -cne $installerName) {
            throw 'SHA256SUMS 中的安装包文件名或校验格式无效。'
          }
          $expectedHash = $Matches[1]
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw '安装包 SHA256 校验失败。' }

      - name: 发布安装包与中文说明
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = "docs/releases/$($env:RELEASE_TAG).md"
          if (-not (Test-Path -LiteralPath $notes)) {
            $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            "摩斯输入 $($env:RELEASE_TAG)：Windows x64 中文安装包。安装包已通过回归测试、码表校验和独立程序启动验收。请使用 SHA256SUMS 核对下载文件。" |
              Set-Content -LiteralPath $notes -Encoding utf8
          }
          $installer = "release-artifacts/MorseWriter-Setup-v$($env:BUILD_VERSION)-x64.exe"
          gh release create $env:RELEASE_TAG $installer 'release-artifacts/SHA256SUMS' --verify-tag --target $env:BUILD_COMMIT --title "摩斯输入 $($env:RELEASE_TAG)" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw '发布失败；已有同名发布不会被覆盖。' }
